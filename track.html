<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-red-700 to-black">
    <div class="flex flex-col items-center">
        <img class="mt-[65px]" src="Beatles.png" alt="picture">
        <div class="flex flex-col text-center">
            <h1 class="text-xl/[28px] font-semibold mt-[66px] text-white">1(Remastered)</h1>
            <p class="text-sm font-medium text-gray-400">The Beatles</p>
        </div>

    </div>
    <div class="flex flex-col">
        <div class="flex flex-col gap-[23px] mt-[38px] pl-[28px]">
            <div class="flex gap-[14px]"> <img src="./assets/photos/heart.svg"> <p class="text-white font-medium text-base/[28px]">Like</p> </div>
            <div class="flex gap-[14px]"> <img src="./assets/photos/Hide.svg"> <p class="text-white font-medium text-base/[28px]">Hide song</p></div>
            <div class="flex gap-[14px]"> <img src="./assets/photos/Playlist.svg"> <p class="text-white font-medium text-base/[28px]">Add to playlist</p></div>
            <div class="flex gap-[14px]"> <img src="./assets/photos/Quque.svg"> <p class="text-white font-medium text-base/[28px]">Add to queue</p></div>
            <div class="flex gap-[14px]"> <img src="./assets/photos/Share.svg"> <p class="text-white font-medium text-base/[28px]">Share</p></div>
            <div class="flex gap-[14px]"> <img src="./assets/photos/Radio.svg"> <p class="text-white font-medium text-base/[28px]">Go to radio</p></div>
            <div class="flex gap-[14px]"> <img src="./assets/photos/Album.svg"> <p class="text-white font-medium text-base/[28px]">View album</p></div>
            <div class="flex gap-[14px]"> <img src="./assets/photos/artist.svg"> <p class="text-white font-medium text-base/[28px]">View artist</p></div>
            <div class="flex gap-[14px]"> <img src="./assets/photos/Credits.svg"> <p class="text-white font-medium text-base/[28px]">Song credits</p></div>
            <div class="flex gap-[14px]"> <img src="./assets/photos/MoonFill.svg"> <p class="text-white font-medium text-base/[28px]">Sleep timer</p></div>
        </div>
    </div>

    <div>
        <p class="flex justify-center text-white font-medium mt-[38px] mb-[40px]">Close</p>
    </div>
</body>
</html>
